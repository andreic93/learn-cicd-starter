name: cd

on:
    push:
        branches: [main]

jobs:
    Deploy:
        name: Deploy
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}

        steps:
            -   name: Check out code
                uses: actions/checkout@v4

            -   name: Set up Go
                uses: actions/setup-go@v5
                with:
                    go-version: "1.22.0"
            
            -   name: Install goose
                run: go install github.com/pressly/goose/v3/cmd/goose@latest
            
            -   name: Run Build Script
                run: ./scripts/buildprod.sh
            
            -   name: Migrate DB
                run: ./scripts/migrateup.sh

            -   id: 'auth'
                uses: 'google-github-actions/auth@v2'
                with:
                    credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

            -   name: 'Set up Cloud SDK'
                uses: 'google-github-actions/setup-gcloud@v3'

            -   name: 'Use gcloud CLI'
                run: 'gcloud info'

            -   name: Build notely image in GCP
                run: gcloud builds submit --tag us-central1-docker.pkg.dev/focus-tree-489815-f9/notely-ar-repo/notely:latest .

            -   name: Deploy to Cloud Run
                run: gcloud run deploy notely --image us-central1-docker.pkg.dev/focus-tree-489815-f9/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project focus-tree-489815-f9 --max-instances=4

            